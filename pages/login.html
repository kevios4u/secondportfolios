  <main class="login-page">
    <section class="login-container" aria-labelledby="login-title">
      <p class="eyebrow">Demo project</p>
      <h1 id="login-title">Login Form</h1>
      <p>A simple interface sample with consistent spacing, labels, and focus states.</p>
      <form class="login-form" action="#" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

        <button type="submit" class="btn">Login</button>
      </form>
      <a href="./projects.html" class="text-link">Back to projects <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
